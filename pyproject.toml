[project]
name = "margin-notes"
dynamic = ["version"]
description = "Review HTML and Markdown in your browser: highlight passages, comment, and save the notes as JSON beside each document."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "John B Nelson", email = "jbn@abreka.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "linkify-it-py>=2.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.14",
    "uvicorn>=0.29",
]
keywords = ["markdown", "html", "review", "annotation", "highlight", "comments", "mathjax", "mermaid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jbn/margin-notes"
Repository = "https://github.com/jbn/margin-notes"
Issues = "https://github.com/jbn/margin-notes/issues"
Changelog = "https://github.com/jbn/margin-notes/blob/main/CHANGELOG.md"

[project.scripts]
margin-notes = "margin_notes.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/margin_notes/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.8",
]
browser = [
    "playwright>=1.45",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: drives a real browser through Playwright (skipped when unavailable)"]
filterwarnings = [
    "error",
    # Newer Starlette's TestClient nudges toward httpx2; harmless for tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]  # ambiguous unicode in UI strings (…, ×) is intentional

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
