name: Release

# Publishing uses PyPI "trusted publishers" (https://docs.pypi.org/trusted-publishers/), so no
# API token is stored in GitHub. Each index needs one configured for this repository with
# workflow `release.yml`:
#
#   - Run this workflow by hand (Actions > Release > Run workflow) to publish to TestPyPI,
#     environment `testpypi`. Use it as a dry run before a real release.
#   - Push a tag like v0.1.0 to publish to PyPI, environment `pypi`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Tag matches package version
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run --no-dev python -c 'import margin_notes; print(margin_notes.__version__)')"
      - run: uv run pytest
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/margin-notes/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/margin-notes/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
